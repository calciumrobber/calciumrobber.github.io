    <style>
      /* Styles for the modal */
      .modal {
        display: none; /* Hidden by default */
        position: fixed;
        z-index: 1; /* Sit on top */
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0, 0, 0, 0.5); /* Black with transparency */
        justify-content: center;
        align-items: center;
      }

      .modal-content {
        background-color: white;
        padding: 20px;
        border-radius: 5px;
        width: 400px;
        text-align: center;
      }

      .close {
        color: #aaa;
        float: right;
        font-size: 28px;
        font-weight: bold;
      }

      .close:hover,
      .close:focus {
        color: black;
        text-decoration: none;
        cursor: pointer;
      }

      /* Styles for the AR button */
      #popup-button {
        position: absolute;
        top: 20px;
        left: 20px;
        background-color: #4CAF50;
        color: white;
        padding: 10px 20px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
      }
    </style>

<!-- GOES AFTER </model-viewer> -->

<!-- INSERT SCULPTURE INFO HERE -->

    <!-- Button to trigger the modal -->
    <button id="popup-button">Sculpture Information</button>

    <!-- The Modal -->
    <div id="myModal" class="modal">
      <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Sculpture Title</h2>
        <p>Artist: Artist</p>
	<p>Date: Date</p>
	<p>Material: Material</p>
	<p>Dimensions: Dimensions</p>
	<p>Accession No: Number</p>
	<p>Credit Line: Credit Line</p>
        <button id="close-modal">Close</button>
      </div>
    </div>

    <script>
      // Get modal and elements
      const modal = document.getElementById("myModal");
      const popupButton = document.getElementById("popup-button");
      const closeButton = document.getElementsByClassName("close")[0];
      const closeModalButton = document.getElementById("close-modal");

      // Open modal when the button is clicked
      popupButton.onclick = function() {
        modal.style.display = "flex";
      }

      // Close modal when the "x" is clicked
      closeButton.onclick = function() {
        modal.style.display = "none";
      }

      // Close modal when "Close" button is clicked
      closeModalButton.onclick = function() {
        modal.style.display = "none";
      }

      // Close modal if the user clicks anywhere outside of it
      window.onclick = function(event) {
        if (event.target == modal) {
          modal.style.display = "none";
        }
      }
    </script>

    <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.0.0/model-viewer.min.js"></script>
